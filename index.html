<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>湖心亭看雪 · 立体细节版</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070b18; }
  canvas { display: block; }
  #boot { position: fixed; inset: 0; z-index: 40; background: radial-gradient(ellipse at 50% 42%, #121c38 0%, #070b18 72%); transition: opacity 1.2s ease; }
  #boot.hide { opacity: 0; pointer-events: none; }
  #fallback { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; text-align: center; padding: 30px; background: radial-gradient(ellipse at 50% 35%, #16224a 0%, #070b18 70%); color: #cdd9ec; font-family: "Songti SC", "SimSun", serif; line-height: 2.2; }
  #fallback b { font-weight: 400; font-size: 20px; letter-spacing: .3em; }
  #fallback span { display: block; font-size: 12px; color: #9fb0cd; letter-spacing: .15em; margin-top: 12px; }
</style>
</head>
<body>
<div id="boot"></div>
<div id="fallback"><div><b>湖心亭看雪</b><span>当前环境未能加载 3D 引擎，请在联网状态下重新打开。</span></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  if (!window.THREE) {
    document.getElementById('boot').classList.add('hide');
    document.getElementById('fallback').style.display = 'flex';
    return;
  }

  // ==================== 基础 ====================
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x2b3654, 0.0058);

  const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 1000);
  camera.position.set(12, 27, 54);

  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.2, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.enablePan = false;
  controls.minDistance = 18;
  controls.maxDistance = 80;
  controls.minPolarAngle = 0.26;
  controls.maxPolarAngle = 1.38;
  controls.autoRotate = false;

  // ==================== 三渲二材质与描边 ====================
  const ramp = new Uint8Array([84, 156, 218, 255]);
  const gradientMap = new THREE.DataTexture(ramp, ramp.length, 1, THREE.LuminanceFormat);
  gradientMap.minFilter = gradientMap.magFilter = THREE.NearestFilter;
  gradientMap.generateMipmaps = false;
  gradientMap.needsUpdate = true;
  function toon(color, opts) {
    return new THREE.MeshToonMaterial(Object.assign({ color: color, gradientMap: gradientMap }, opts || {}));
  }
  function outline(mesh, thickness, color) {
    const t = (thickness === undefined ? 0.05 : thickness) * 3.4;
    const c = color === undefined ? 0x080b12 : color;
    const g = mesh.geometry.clone();
    const pos = g.attributes.position, nor = g.attributes.normal;
    if (!nor) return;
    for (let i = 0; i < pos.count; i++) {
      pos.setXYZ(i, pos.getX(i) + nor.getX(i) * t, pos.getY(i) + nor.getY(i) * t, pos.getZ(i) + nor.getZ(i) * t);
    }
    pos.needsUpdate = true;
    const o = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: c, side: THREE.BackSide, fog: true, toneMapped: false }));
    o.castShadow = false; o.receiveShadow = false;
    mesh.add(o);
    return o;
  }
  function radialTexture(inner, outer) {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(64, 64, 3, 64, 64, 64);
    g.addColorStop(0, inner); g.addColorStop(1, outer);
    x.fillStyle = g; x.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  }
  function contactShadow(x, z, size, opacity) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size * 0.8),
      new THREE.MeshBasicMaterial({ map: radialTexture('rgba(28,40,66,0.5)', 'rgba(28,40,66,0)'), transparent: true, opacity: opacity || 0.5, depthWrite: false, fog: false }));
    m.rotation.x = -Math.PI / 2; m.position.set(x, 0.34, z); scene.add(m); return m;
  }

  const M = {
    snow: toon(0xe2ecf7), snowBright: toon(0xf3f8fd), snowShade: toon(0xcbd8e8),
    wood: toon(0x5a3b2a), woodDark: toon(0x3b271c), woodWorn: toon(0x7d5a3e),
    tile: toon(0x141821), stone: toon(0xd3dce8), stoneGray: toon(0xb7c2d0),
    metal: toon(0x8f98a5), leather: toon(0x4a3324), wicker: toon(0xa98150),
    bamboo: toon(0x7f9457), bell: toon(0xc9a860), celadon: toon(0x6f9a9d),
    celadonLight: toon(0xa8c8c6), teal: toon(0x345c5a), ink: toon(0x2b241c),
    iceSpike: toon(0xa9cbe2), dryGrass: toon(0x9a8a6b)
  };

  // ==================== 星月夜天空 ====================
  const skyUniforms = { uTime: { value: 0 } };
  const sky = new THREE.Mesh(new THREE.SphereGeometry(480, 44, 28), new THREE.ShaderMaterial({
    uniforms: skyUniforms, side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: `varying vec3 vDir;
      void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `
      uniform float uTime; varying vec3 vDir;
      float hash(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
      float noise(vec3 x){ vec3 i=floor(x),f=fract(x); f=f*f*(3.0-2.0*f);
        return mix(mix(mix(hash(i+vec3(0,0,0)),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
                   mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z); }
      float fbm(vec3 p){ float v=0.0,a=0.5; for(int i=0;i<5;i++){v+=a*noise(p);p=p*2.03+vec3(1.7);a*=0.5;} return v; }
      void main(){
        vec3 d=normalize(vDir); float h=d.y;
        vec2 uv=d.xy/(d.y*0.5+1.25); vec2 sc=vec2(-0.20,0.50); vec2 q=uv-sc;
        float r=length(q), ang=atan(q.y,q.x);
        float sa=ang+2.0/(r+0.30)+uTime*0.045;
        vec2 sq=sc+r*vec2(cos(sa),sin(sa));
        float n1=fbm(vec3(sq*4.0,uTime*0.03)), n2=fbm(vec3(sq*7.5+11.0,uTime*0.02));
        float stroke=sin(sa*3.0+n1*7.0)*0.5+0.5;
        vec3 col=mix(vec3(0.03,0.045,0.13),vec3(0.09,0.15,0.42),smoothstep(0.15,0.72,n1));
        col=mix(col,vec3(0.30,0.20,0.62),smoothstep(0.42,0.92,n2)*0.80);
        col+=vec3(0.55,0.62,0.92)*pow(stroke,3.0)*0.26*smoothstep(0.06,0.80,n1);
        float az=atan(d.z,d.x); float bandY=0.28+0.16*sin(az*2.0+0.6);
        float band=exp(-pow((h-bandY)*5.5,2.0)); float bn=fbm(vec3(d*6.0+vec3(0.0,uTime*0.01,0.0)));
        col+=vec3(0.62,0.66,0.80)*band*(0.10+0.16*bn);
        vec3 focus=normalize(vec3(0.0,0.42,0.55));
        col+=vec3(0.16,0.20,0.34)*pow(max(dot(d,focus),0.0),7.0);
        float sf=hash(floor(d*280.0)); float star=step(0.9968,sf);
        float breathe=0.5+0.5*sin(uTime*1.3+sf*220.0);
        col+=vec3(0.92,0.94,1.0)*star*(0.45+0.55*breathe)*1.7;
        for(int i=0;i<3;i++){ float fi=float(i);
          vec3 mp=normalize(vec3(-0.55+fi*0.5,0.62-fi*0.09,0.42)); float md=distance(d,mp);
          col+=vec3(0.85,0.90,1.0)*((1.0-smoothstep(0.0,0.012,md))*1.2+exp(-md*75.0)*0.5)*step(0.5,hash(vec3(fi,3.0,7.0))); }
        col=mix(col,vec3(0.16,0.22,0.38),smoothstep(0.12,-0.10,h)*0.92);
        gl_FragColor=vec4(col,1.0);
      }`
  }));
  scene.add(sky);

  // ==================== 灯光 ====================
  scene.add(new THREE.AmbientLight(0x4a6088, 0.5));
  scene.add(new THREE.HemisphereLight(0x8ea9d8, 0x161c2b, 0.62));
  const moon = new THREE.DirectionalLight(0xbcd2ff, 0.9);
  moon.position.set(-16, 30, 20);
  moon.castShadow = true;
  moon.shadow.mapSize.set(2048, 2048);
  moon.shadow.camera.left = -30; moon.shadow.camera.right = 30;
  moon.shadow.camera.top = 30; moon.shadow.camera.bottom = -30;
  moon.shadow.camera.near = 1; moon.shadow.camera.far = 110;
  moon.shadow.bias = -0.0006;
  scene.add(moon);

  // ==================== 正方形底座 / 辽阔冰湖 ====================
  const S = 42;
  const baseBody = new THREE.Mesh(new THREE.BoxGeometry(S, 1.8, S), toon(0x2b3852));
  baseBody.position.y = -0.9; baseBody.castShadow = true; baseBody.receiveShadow = true;
  scene.add(baseBody); outline(baseBody, 0.08);

  const snowBase = new THREE.Mesh(new THREE.BoxGeometry(S, 0.24, S), M.snow);
  snowBase.position.y = 0.12; snowBase.receiveShadow = true; scene.add(snowBase);

  // 起伏雪面（多频斜向叠加，避免同心波纹）
  const fieldGeo = new THREE.PlaneGeometry(S, S, 64, 64);
  {
    const pa = fieldGeo.attributes.position;
    for (let i = 0; i < pa.count; i++) {
      const x = pa.getX(i), y = pa.getY(i);
      const edge = Math.max(0, Math.min(1, (S/2 - Math.abs(x)) / 2.5)) * Math.max(0, Math.min(1, (S/2 - Math.abs(y)) / 2.5));
      let h = Math.sin(x*0.31+y*0.19)*Math.cos(y*0.27-x*0.11)*0.018
            + Math.sin(x*1.07-y*0.83)*0.009 + Math.cos(x*0.57+y*0.71)*0.008;
      h += 0.022 * Math.pow(Math.max(0, Math.sin(x*1.5+y*0.4)*Math.sin(y*0.85-x*0.27)), 4);
      pa.setZ(i, h * edge);
    }
    fieldGeo.computeVertexNormals();
  }
  const field = new THREE.Mesh(fieldGeo, M.snowBright);
  field.rotation.x = -Math.PI/2; field.position.y = 0.25; field.receiveShadow = true; scene.add(field);

  // 大面积半透明淡蓝冰层（偏向前岸与舟侧，湖面主体仍是雪）
  const iceMat = toon(0x8bbdd8, { transparent: true, opacity: 0.72 });
  const iceA = new THREE.Mesh(new THREE.CircleGeometry(12.5, 64), iceMat);
  iceA.rotation.x = -Math.PI/2; iceA.position.set(7.5, 0.30, 9.5); iceA.receiveShadow = true; scene.add(iceA);
  const iceB = new THREE.Mesh(new THREE.CircleGeometry(9, 64), iceMat);
  iceB.rotation.x = -Math.PI/2; iceB.position.set(-9, 0.30, 7); iceB.receiveShadow = true; scene.add(iceB);
  // 冰面淡青浅灰层次
  const iceTint = new THREE.Mesh(new THREE.CircleGeometry(6.5, 48), toon(0xa8cfdd, { transparent: true, opacity: 0.4 }));
  iceTint.rotation.x = -Math.PI/2; iceTint.position.set(8.5, 0.31, 11); scene.add(iceTint);

  // 冰裂纹 / 气泡 / 霜花 / 覆雪冰脊
  {
    const pts = [];
    for (let i = 0; i < 16; i++) {
      const cx = 7.5 + (Math.random()-0.5)*20, cz = 9.5 + (Math.random()-0.5)*18;
      let x = cx, z = cz;
      for (let j = 0; j < 3; j++) {
        const nx = x + (Math.random()-0.5)*3.4, nz = z + (Math.random()-0.5)*3.4;
        pts.push(x, 0.32, z, nx, 0.32, nz); x = nx; z = nz;
      }
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    scene.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0xa9cee6, transparent: true, opacity: 0.5, fog: false })));
  }
  // 气泡与霜花（小贴片）
  {
    const bubbleTex = radialTexture('rgba(235,246,255,0.75)', 'rgba(235,246,255,0)');
    for (let i = 0; i < 26; i++) {
      const b = new THREE.Mesh(new THREE.PlaneGeometry(0.24, 0.24),
        new THREE.MeshBasicMaterial({ map: bubbleTex, transparent: true, opacity: 0.6, depthWrite: false, fog: false }));
      b.rotation.x = -Math.PI/2;
      b.position.set(7.5 + (Math.random()-0.5)*22, 0.325, 9.5 + (Math.random()-0.5)*18);
      scene.add(b);
    }
  }
  for (let i = 0; i < 8; i++) {
    const a = Math.random()*Math.PI*2, r = 5 + Math.random()*8;
    const ridge = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 6), M.snowBright);
    ridge.scale.set(1.4 + Math.random(), 0.08, 0.18);
    ridge.position.set(7.5 + Math.cos(a)*r, 0.33, 9.5 + Math.sin(a)*r);
    ridge.rotation.y = a + Math.PI/2; scene.add(ridge);
  }

  // 风纹 / 雪坑 / 脚印 + 浅步行轨迹
  {
    const footTex = radialTexture('rgba(120,145,180,0.6)', 'rgba(120,145,180,0)');
    for (let i = 0; i < 10; i++) {
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-17+i*3.4, 0.33, -8+(i%3)*5),
        new THREE.Vector3(-15+i*3.4, 0.33, -7+(i%3)*5),
        new THREE.Vector3(-12+i*3.4, 0.33, -7.5+(i%3)*5)
      ]);
      scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 12, 0.016, 4, false),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3, fog: false })));
    }
    for (let i = 0; i < 7; i++) {
      const p = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.3),
        new THREE.MeshBasicMaterial({ map: footTex, transparent: true, opacity: 0.35, depthWrite: false, fog: false }));
      p.rotation.x = -Math.PI/2;
      p.position.set((Math.random()-0.5)*30, 0.34, (Math.random()-0.5)*26); scene.add(p);
    }
  }

  // ==================== 不规则前景湖岸 ====================
  // 雪坡 + 冰棱 + 湿润石 + 枯草
  for (let i = 0; i < 22; i++) {
    const x = -19 + i*1.8 + (Math.random()-0.5)*1.2;
    const z = 17.5 + Math.sin(i*0.7)*1.2 + (Math.random()-0.5)*0.9;
    const mound = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), M.snowBright);
    mound.scale.set(1.2 + Math.random()*0.9, 0.3 + Math.random()*0.22, 0.8 + Math.random()*0.5);
    mound.position.set(x, 0.36, z); mound.receiveShadow = true; scene.add(mound);
    if (i % 3 === 0) {
      const spike = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.5 + Math.random()*0.4, 5), M.iceSpike);
      spike.position.set(x + 0.5, 0.5, z - 0.9); spike.rotation.z = (Math.random()-0.5)*0.5; scene.add(spike);
    }
    if (i % 4 === 0) {
      const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.28, 0), M.stoneGray);
      rock.position.set(x - 0.4, 0.4, z - 0.5); rock.scale.y = 0.6; scene.add(rock);
    }
    if (i % 5 === 0) {
      for (let k = 0; k < 3; k++) {
        const grass = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.012, 0.4, 4), M.dryGrass);
        grass.position.set(x + k*0.08, 0.5, z - 0.6);
        grass.rotation.z = (k-1)*0.3; scene.add(grass);
      }
    }
  }

  // ==================== 湖心亭（缩小，位于中心偏上） ====================
  const pavilion = new THREE.Group();
  // 亭下雪地接触阴影
  contactShadow(0, -4.5, 9, 0.42);

  const floor = new THREE.Mesh(new THREE.CylinderGeometry(2.7, 2.8, 0.18, 8), M.stoneGray);
  floor.position.y = 0.45; floor.receiveShadow = true; pavilion.add(floor); outline(floor, 0.03);
  // 石板纹
  for (let i = 0; i < 8; i++) {
    const a = i/8*Math.PI*2;
    const seam = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.02, 2.4), M.stone);
    seam.position.set(Math.cos(a)*1.2, 0.55, Math.sin(a)*1.2); seam.rotation.y = -a; pavilion.add(seam);
  }
  const platform = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.42, 5.2), M.stone);
  platform.position.y = 0.63; platform.castShadow = true; platform.receiveShadow = true; pavilion.add(platform); outline(platform, 0.045);
  const platformTop = new THREE.Mesh(new THREE.BoxGeometry(4.9, 0.1, 4.9), M.snowBright);
  platformTop.position.y = 0.88; platformTop.receiveShadow = true; pavilion.add(platformTop);

  // 四柱 + 圆角柱础 + 斜撑
  const P = 1.95;
  const corners = [[P,P],[-P,P],[P,-P],[-P,-P]];
  corners.forEach(function (c) {
    const col = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.23, 3.1, 12), M.wood);
    col.position.set(c[0], 2.5, c[1]); col.castShadow = true; pavilion.add(col); outline(col, 0.032);
    const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.29, 0.32, 0.12, 12), M.stone);
    foot.position.set(c[0], 0.99, c[1]); pavilion.add(foot);
    const brace = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.1, 0.1), M.woodWorn);
    brace.position.set(c[0]*0.72, 3.88, c[1]*0.72);
    brace.rotation.y = -Math.atan2(c[1], c[0]); brace.rotation.z = 0.4;
    brace.castShadow = true; pavilion.add(brace);
  });
  // 额枋 + 下层横枋
  [[0,1],[0,2],[1,3],[2,3]].forEach(function (pair) {
    const a = corners[pair[0]], b = corners[pair[1]];
    const len = Math.hypot(b[0]-a[0], b[1]-a[1]);
    [4.04, 3.55].forEach(function (yy, idx) {
      const bar = new THREE.Mesh(new THREE.BoxGeometry(len, idx ? 0.13 : 0.26, idx ? 0.14 : 0.22), idx ? M.woodWorn : M.woodDark);
      bar.position.set((a[0]+b[0])/2, yy, (a[1]+b[1])/2);
      bar.rotation.y = -Math.atan2(b[1]-a[1], b[0]-a[0]);
      bar.castShadow = true; pavilion.add(bar); outline(bar, 0.026);
    });
  });
  // 栏杆（三面，竖杆+横杆）
  [[0,1],[0,2],[1,3]].forEach(function (pair) {
    const a = corners[pair[0]], b = corners[pair[1]];
    const len = Math.hypot(b[0]-a[0], b[1]-a[1]);
    const rail = new THREE.Mesh(new THREE.BoxGeometry(len, 0.13, 0.12), M.woodDark);
    rail.position.set((a[0]+b[0])/2, 1.66, (a[1]+b[1])/2);
    rail.rotation.y = -Math.atan2(b[1]-a[1], b[0]-a[0]);
    rail.castShadow = true; pavilion.add(rail); outline(rail, 0.022);
    const railSnow = new THREE.Mesh(new THREE.BoxGeometry(len, 0.05, 0.14), M.snowBright);
    railSnow.position.set(rail.position.x, 1.75, rail.position.z); railSnow.rotation.y = rail.rotation.y; pavilion.add(railSnow);
    for (let t = 1; t < 3; t++) {
      const q = new THREE.Vector3().lerpVectors(new THREE.Vector3(a[0],0,a[1]), new THREE.Vector3(b[0],0,b[1]), t/3);
      const v = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.78, 0.08), M.woodDark);
      v.position.set(q.x, 1.33, q.z); pavilion.add(v); outline(v, 0.016);
    }
  });

  // 攒尖顶：瓦面层叠 + 覆雪 + 檐角上翘 + 瓦当
  const roof = new THREE.Mesh(new THREE.ConeGeometry(4.0, 2.4, 4), M.tile);
  roof.position.y = 5.2; roof.rotation.y = Math.PI/4; roof.castShadow = true; pavilion.add(roof); outline(roof, 0.05);
  // 瓦片层叠（沿四面斜向排列的细瓦棱）
  for (let side = 0; side < 4; side++) {
    const baseA = side/4*Math.PI*2 + Math.PI/4;
    for (let row = 0; row < 4; row++) {
      const rr = 1.0 + row*0.72;
      const tileRow = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.045, rr*1.15), M.tile);
      tileRow.position.set(Math.cos(baseA)*rr*0.5, 5.85 - row*0.42, Math.sin(baseA)*rr*0.5);
      tileRow.rotation.y = -baseA + Math.PI/2;
      pavilion.add(tileRow);
    }
  }
  const eave = new THREE.Mesh(new THREE.ConeGeometry(4.45, 0.5, 4), M.tile);
  eave.position.y = 4.12; eave.rotation.y = Math.PI/4; eave.castShadow = true; pavilion.add(eave); outline(eave, 0.045);
  // 瓦当（檐口小圆头）
  for (let i = 0; i < 16; i++) {
    const a = i/16*Math.PI*2;

    for (let i = 0; i < N; i++) pos.push( st[i].w*0.42, botY, st[i].t*L/2);
    for (let i = 0; i < N-1; i++) {
      idx.push(i, i+1, 2*N+i, i+1, 2*N+i+1, 2*N+i);
      idx.push(N+i, 3*N+i, N+i+1, N+i+1, 3*N+i, 3*N+i+1);
      idx.push(2*N+i, 2*N+i+1, 3*N+i, 2*N+i+1, 3*N+i+1, 3*N+i);
    }
    const ib = pos.length/3;
    for (let i = 0; i < N; i++) pos.push(-st[i].w*0.8, topY-0.12, st[i].t*L/2);
    for (let i = 0; i < N; i++) pos.push( st[i].w*0.8, topY-0.12, st[i].t*L/2);
    for (let i = 0; i < N-1; i++) {

  }
  for (let i = 0; i < 4; i++) {
    const wear = new THREE.Mesh(new THREE.BoxGeometry(0.18+Math.random()*0.2, 0.02, 0.1), M.woodWorn);
    wear.position.set((Math.random()-0.5)*1.1, 0.92, -1 + Math.random()*1.4); sled.add(wear);
  }
  const sledSnow = new THREE.Mesh(new THREE.BoxGeometry(1.44, 0.05, 1.26), M.snowBright);
  sledSnow.position.set(0, 1.23, -0.5); sled.add(sledSnow);
  const backSnow = new THREE.Mesh(new THREE.BoxGeometry(1.42, 0.05, 0.16), M.snowBright);
  backSnow.position.set(0, 1.71, -1.05); sled.add(backSnow);
  sled.position.set(-7.5, 0.34, 16); sled.rotation.y = -0.45; scene.add(sled);

  // 暗青油纸伞（斜靠雪橇）
  const umbrella = new THREE.Group();
  const uHandle = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 2.4, 8), M.woodDark);
  uHandle.position.y = 0.2; umbrella.add(uHandle); outline(uHandle, 0.018);
  const uCanopy = new THREE.Mesh(new THREE.ConeGeometry(0.3, 1.8, 10), M.teal);
  uCanopy.position.y = 0.92; umbrella.add(uCanopy); outline(uCanopy, 0.025);
  for (let i = 0; i < 5; i++) {
    const a = i/5*Math.PI*2;
    const rib = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 1.6, 5), M.woodDark);
    rib.position.set(Math.cos(a)*0.16, 0.92, Math.sin(a)*0.16);
    rib.rotation.z = Math.cos(a)*0.16; rib.rotation.x = -Math.sin(a)*0.16; umbrella.add(rib);
  }
  const uTip = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.3, 8), M.woodDark);
  uTip.position.y = 2.02; umbrella.add(uTip);
  umbrella.position.set(-9.2, 0.9, 16.4); umbrella.rotation.set(0.1, 0.2, 0.32); scene.add(umbrella);

  // ==================== 远景层次 ====================
  function farMountain(x, z, radius, height, color, rot) {
    const m = new THREE.Mesh(new THREE.ConeGeometry(radius, height, 5),
      new THREE.MeshBasicMaterial({ color: color, fog: true, transparent: true, opacity: 0.7 }));
    m.position.set(x, height/2 + 0.1, z); m.rotation.y = rot; scene.add(m);
    const cap = new THREE.Mesh(new THREE.ConeGeometry(radius*0.4, height*0.3, 5),
      new THREE.MeshBasicMaterial({ color: 0xd8e2ee, fog: true, transparent: true, opacity: 0.68 }));
    cap.position.set(x, height - height*0.15 + 0.1, z); cap.rotation.y = rot; scene.add(cap);
  }
  [[-16,-18,2.8,4.2,0x8b9bb2,0.4],[-9,-19,3.4,5.4,0x93a3ba,1.1],[-1,-19.5,3.0,4.6,0x8b9bb2,2.0],
   [8,-19,3.6,5.6,0x9aaac0,0.7],[16,-18,3.2,4.8,0x93a3ba,1.6]].forEach(function (m) { farMountain(m[0],m[1],m[2],m[3],m[4],m[5]); });

  function rimeTree(x, z, s) {
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.05*s, 0.09*s, 1.8*s, 6), M.snowBright);
    trunk.position.y = 0.9*s; g.add(trunk);
    for (let i = 0; i < 5; i++) {
      const a = i/5*Math.PI*2 + 0.5, len = (0.8 + (i%2)*0.4)*s;
      const b = new THREE.Mesh(new THREE.CylinderGeometry(0.012*s, 0.035*s, len, 5), M.snowBright);
      b.position.set(Math.cos(a)*len*0.25, (1.35+(i%3)*0.28)*s, Math.sin(a)*len*0.25);
      b.rotation.z = Math.cos(a)*0.85; b.rotation.x = -Math.sin(a)*0.85; g.add(b);
    }
    g.position.set(x, 0.3, z); scene.add(g);
  }
  [[-18,-11,1.5],[-15,-14,1.8],[-8,-16,1.4],[0,-16.5,1.6],[9,-16,1.5],[16,-13,1.7],[18,-5,1.4],[-19,-4,1.5]].forEach(function (t) { rimeTree(t[0],t[1],t[2]); });

  function pineTree(x, z, s) {
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.06*s, 0.12*s, 2.0*s, 7), M.woodDark);
    trunk.position.y = 1.0*s; g.add(trunk);
    for (let i = 0; i < 4; i++) {
      const a = i/4*Math.PI*2, len = (0.9 + i%2*0.35)*s;
      const b = new THREE.Mesh(new THREE.CylinderGeometry(0.02*s, 0.05*s, len, 6), M.woodDark);
      b.position.set(Math.cos(a)*len*0.3, (1.5+(i%2)*0.3)*s, Math.sin(a)*len*0.3);
      b.rotation.z = Math.cos(a)*1.0; b.rotation.x = -Math.sin(a)*1.0; g.add(b);
      const sb = new THREE.Mesh(new THREE.CylinderGeometry(0.025*s, 0.055*s, len*0.7, 6), M.snowBright);
      sb.position.copy(b.position); sb.position.y += 0.03*s; sb.rotation.copy(b.rotation); g.add(sb);
    }
    g.position.set(x, 0.3, z); scene.add(g);
  }
  pineTree(-16, -7, 1.3); pineTree(14, -9, 1.4); pineTree(-19, 2, 1.2); pineTree(19, 1, 1.3);

  function smallBridge(x, z, ry) {
    const g = new THREE.Group();
    const arc = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.09, 6, 16, Math.PI), toon(0x7a3b32));
    arc.position.y = 0.5; g.add(arc);
    const as = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.045, 6, 16, Math.PI), M.snowBright);
    as.position.y = 0.55; g.add(as);
    for (let i = 0; i < 3; i++) {
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.7, 0.08), toon(0x7a3b32));
      post.position.set(-1 + i, 0.35, 0); g.add(post);
    }
    g.position.set(x, 0.3, z); g.rotation.y = ry; g.scale.setScalar(0.65); scene.add(g);
  }
  smallBridge(-10, -14.5, 0.15); smallBridge(4, -15, -0.2); smallBridge(13, -14, 0.1);

  // 小庙屋顶轮廓（远景剪影）
  function shrineRoof(x, z, s) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.9, 1.4), toon(0x6d5a52));
    body.position.y = 0.45; g.add(body);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(1.5, 0.85, 4), toon(0x3d3436));
    roof.position.y = 1.35; roof.rotation.y = Math.PI/4; g.add(roof);
    const snow = new THREE.Mesh(new THREE.ConeGeometry(1.44, 0.72, 4), M.snowBright);
    snow.position.y = 1.42; snow.rotation.y = Math.PI/4; g.add(snow);
    g.position.set(x, 0.3, z); g.scale.setScalar(s); scene.add(g);
  }
  shrineRoof(-4, -16.8, 0.8); shrineRoof(10, -17, 0.65);

  // 山脚薄雾（贴地）
  {
    const mistTex = radialTexture('rgba(198,214,236,0.42)', 'rgba(198,214,236,0)');
    for (let i = 0; i < 6; i++) {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(12, 4),
        new THREE.MeshBasicMaterial({ map: mistTex, transparent: true, opacity: 0.34, depthWrite: false, fog: false }));
      m.position.set(-15 + i*6, 1.0, -16); scene.add(m);
    }
  }

  // ==================== 细微动效 ====================
  // 多层飘雪
  const SN = 560;
  const snowPos = new Float32Array(SN*3), snowSpd = new Float32Array(SN), snowSeed = new Float32Array(SN);
  for (let i = 0; i < SN; i++) {
    snowPos[i*3] = (Math.random()-0.5)*48;
    snowPos[i*3+1] = Math.random()*26 + 0.4;
    snowPos[i*3+2] = (Math.random()-0.5)*48;
    snowSpd[i] = 0.3 + Math.random()*0.9;
    snowSeed[i] = Math.random()*100;
  }
  const snowGeo = new THREE.BufferGeometry();
  snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
  scene.add(new THREE.Points(snowGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.13, transparent: true, opacity: 0.8, sizeAttenuation: true, depthWrite: false, fog: false })));

  // 贴地霜雾
  const frostMists = [];
  const frostTex = radialTexture('rgba(212,228,246,0.26)', 'rgba(212,228,246,0)');
  for (let i = 0; i < 4; i++) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(19, 19),
      new THREE.MeshBasicMaterial({ map: frostTex, transparent: true, opacity: 0.5, depthWrite: false, fog: false }));
    m.rotation.x = -Math.PI/2; m.position.set((i-1.5)*9, 0.36 + i*0.01, -8 + i*6);
    scene.add(m); frostMists.push(m);
  }

  // 木牌 / 竹栅栏附近风雪粉
  const powderN = 100;
  const powderPos = new Float32Array(powderN*3), powderSeed = new Float32Array(powderN);
  for (let i = 0; i < powderN; i++) {
    powderPos[i*3] = -16 + Math.random()*32;
    powderPos[i*3+1] = 0.35 + Math.random()*1.8;
    powderPos[i*3+2] = 13 + Math.random()*5;
    powderSeed[i] = Math.random()*100;
  }
  const powderGeo = new THREE.BufferGeometry();
  powderGeo.setAttribute('position', new THREE.BufferAttribute(powderPos, 3));
  scene.add(new THREE.Points(powderGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.07, transparent: true, opacity: 0.45, sizeAttenuation: true, depthWrite: false, fog: false })));

  // 檐角融雪水滴 + 凹痕
  const dentTex = radialTexture('rgba(60,78,108,0.45)', 'rgba(60,78,108,0)');
  const dents = [];
  for (let i = 0; i < 14; i++) {
    const d = new THREE.Mesh(new THREE.PlaneGeometry(0.85, 0.85),
      new THREE.MeshBasicMaterial({ map: dentTex, transparent: true, opacity: 0, depthWrite: false, fog: false }));
    d.rotation.x = -Math.PI/2; d.position.y = 0.35; d.visible = false;
    scene.add(d); dents.push({ mesh: d, used: false, target: 0 });
  }
  let dentCursor = 0;
  const drops = [], dropGeo = new THREE.SphereGeometry(0.055, 8, 6);
  const dropMat = new THREE.MeshBasicMaterial({ color: 0xcfe4f6, transparent: true, opacity: 0.9, fog: false });
  function spawnDrop() {
    const c = corners[Math.floor(Math.random()*4)];
    const d = new THREE.Mesh(dropGeo, dropMat);
    d.position.set(c[0]*1.6, 3.6, -5 + c[1]*1.6); d.scale.y = 1.6;
    scene.add(d); drops.push({ mesh: d, speed: 3.0 + Math.random()*1.2 });
  }
  function makeDent(x, z) {
    const o = dents[dentCursor % dents.length]; dentCursor++;
    o.mesh.position.set(x, 0.35, z); o.mesh.material.opacity = 0;
    o.mesh.visible = true; o.used = true; o.target = 0.3 + Math.random()*0.16;
  }

  // ==================== 循环 ====================
  const clock = new THREE.Clock();
  let dropTimer = 3, started = false;
  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    skyUniforms.uTime.value = t;
    sky.position.copy(camera.position);

    const sp = snowGeo.attributes.position.array;
    for (let i = 0; i < SN; i++) {
      sp[i*3+1] -= snowSpd[i]*dt;
      sp[i*3]   += Math.sin(t*0.5 + snowSeed[i])*0.006;
      sp[i*3+2] += Math.cos(t*0.45 + snowSeed[i])*0.005;
      if (sp[i*3+1] < 0.2) sp[i*3+1] = 26.4;
    }
    snowGeo.attributes.position.needsUpdate = true;

    const pp = powderGeo.attributes.position.array;
    for (let i = 0; i < powderN; i++) {
      pp[i*3]   += (0.08 + Math.sin(t*0.7 + powderSeed[i])*0.06)*dt;
      pp[i*3+1] += Math.sin(t*1.1 + powderSeed[i]*2)*0.05*dt;
      if (pp[i*3] > 16) pp[i*3] = -16;
    }
    powderGeo.attributes.position.needsUpdate = true;

    const flick = 0.955 + 0.028*Math.sin(t*3.1)*Math.sin(t*1.7) + 0.012*Math.sin(t*7.3);
    lanternLight.intensity = 3.4 * flick;
    warmMat.opacity = 0.85 * flick;
    warmCoreMat.opacity = 0.72 * flick;
    stoneGlowMat.opacity = 0.7 * flick;
    slLight.intensity = 1.2 * flick;
    signLight.intensity = 0.6 * flick;
    rbLight.intensity = 0.5 * flick;
    slGlow.material.color.setHSL(0.11, 0.85, 0.62 + 0.03*Math.sin(t*2.7));
    for (let i = 0; i < snowLampGlows.length; i++) {
      snowLampGlows[i].material.color.setHSL(0.11, 0.85, 0.6 + 0.035*Math.sin(t*2.2 + i));
    }

    for (let i = 0; i < frostMists.length; i++) {
      frostMists[i].position.x = (i-1.5)*9 + Math.sin(t*0.07 + i*1.4)*2.6;
      frostMists[i].rotation.z = t*0.01*(i%2 ? 1 : -1);
    }

    dropTimer -= dt;
    if (dropTimer <= 0) { spawnDrop(); dropTimer = 5 + Math.random()*7; }
    for (let i = drops.length-1; i >= 0; i--) {
      const d = drops[i];
      d.mesh.position.y -= d.speed*dt;
      if (d.mesh.position.y <= 0.33) {
        makeDent(d.mesh.position.x, d.mesh.position.z);
        scene.remove(d.mesh); drops.splice(i, 1);
      }
    }
    for (let i = 0; i < dents.length; i++) {
      const o = dents[i];
      if (o.used && o.mesh.material.opacity < o.target) {
        o.mesh.material.opacity = Math.min(o.target, o.mesh.material.opacity + dt*0.6);
      }
    }

    controls.update();
    renderer.render(scene, camera);

    if (!started) {
      started = true;
      setTimeout(function () { document.getElementById('boot').classList.add('hide'); }, 300);
    }
  }
  animate();

  addEventListener('resize', function () {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>
</body>
</html>
